<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066cc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#003399;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffa500;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="#1a1a2e"/>
  
  <!-- Outer glow ring -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="#0066cc" stroke-width="8" opacity="0.3"/>
  
  <!-- Arduino-style shield shape -->
  <path d="M256 120 L420 200 L420 380 L256 512 L90 380 L90 200 Z" 
        fill="url(#grad1)" filter="url(#shadow)"/>
  
  <!-- Inner circuit board -->
  <path d="M256 140 L400 220 L400 380 L256 490 L112 380 L112 220 Z" 
        fill="#0f2a4a" opacity="0.8"/>
  
  <!-- Circuit traces -->
  <path d="M256 220 L320 220 M256 280 L320 280 M256 340 L320 340" 
        stroke="#00aaff" stroke-width="4" stroke-linecap="round"/>
  <path d="M192 240 L256 240 M192 300 L256 300 M192 360 L256 360" 
        stroke="#00aaff" stroke-width="4" stroke-linecap="round"/>
  <path d="M200 200 L150 240 L150 300 L200 340" 
        stroke="#00aaff" stroke-width="3" stroke-linecap="round"/>
  <path d="M312 200 L362 240 L362 300 L312 340" 
        stroke="#00aaff" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Circuit dots (nodes) -->
  <circle cx="256" cy="220" r="6" fill="#ffd700"/>
  <circle cx="320" cy="220" r="6" fill="#ffd700"/>
  <circle cx="256" cy="280" r="6" fill="#ffd700"/>
  <circle cx="320" cy="280" r="6" fill="#ffd700"/>
  <circle cx="256" cy="340" r="6" fill="#ffd700"/>
  <circle cx="320" cy="340" r="6" fill="#ffd700"/>
  <circle cx="256" cy="240" r="5" fill="#ffd700"/>
  <circle cx="192" cy="240" r="5" fill="#ffd700"/>
  <circle cx="256" cy="300" r="5" fill="#ffd700"/>
  <circle cx="192" cy="300" r="5" fill="#ffd700"/>
  <circle cx="256" cy="360" r="5" fill="#ffd700"/>
  <circle cx="192" cy="360" r="5" fill="#ffd700"/>
  <circle cx="312" cy="240" r="5" fill="#ffd700"/>
  <circle cx="362" cy="240" r="5" fill="#ffd700"/>
  <circle cx="312" cy="340" r="5" fill="#ffd700"/>
  <circle cx="362" cy="340" r="5" fill="#ffd700"/>
  
  <!-- AARUARDUINO text -->
  <text x="256" y="285" font-family="Arial, sans-serif" font-size="34" font-weight="bold" 
        fill="#ffffff" text-anchor="middle" letter-spacing="2">AARUARDUINO</text>
  
  <!-- "MADE BY AARUTO" subtitle -->
  <text x="256" y="325" font-family="Arial, sans-serif" font-size="16" font-weight="bold" 
        fill="#ffd700" text-anchor="middle" letter-spacing="1">MADE BY AARUTO</text>
  
  <!-- Small Arduino-style power symbol -->
  <circle cx="256" cy="180" r="16" fill="none" stroke="#ffffff" stroke-width="3"/>
  <path d="M256 166 L256 184" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Pin headers (bottom) -->
  <rect x="120" cy="470" width="4" height="16" fill="#666666"/>
  <rect x="230" cy="470" width="4" height="16" fill="#666666"/>
  <rect x="340" cy="470" width="4" height="16" fill="#666666"/>
  <rect x="396" cy="470" width="4" height="16" fill="#666666"/>
  
  <!-- Spark/dots around logo -->
  <circle cx="140" cy="140" r="3" fill="#ffffff" opacity="0.6"/>
  <circle cx="372" cy="140" r="3" fill="#ffffff" opacity="0.6"/>
  <circle cx="140" cy="372" r="3" fill="#ffffff" opacity="0.6"/>
  <circle cx="372" cy="372" r="3" fill="#ffffff" opacity="0.6"/>
</svg>
